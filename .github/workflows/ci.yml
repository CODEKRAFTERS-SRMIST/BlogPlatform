name: CI

on:
  push:
    branches: [main, integration-2]
  pull_request:
    branches: [main, integration-2]

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  server-audit:
    name: Server — Audit & Lint
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: Server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=moderate

      - name: Check for duplicate files
        run: |
          [ ! -d "src/controller" ] || (echo "Duplicate src/controller/ directory found" && exit 1)
          echo "No duplicate files found"

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Check environment template completeness
        run: |
          for key in NODE_ENV PORT DATABASE_URL JWT_SECRET JWT_REFRESH_SECRET FRONTEND_URL; do
            grep -q "^${key}=" .env.example || (echo "Missing ${key} in .env.example" && exit 1)
          done
          echo ".env.example is complete"

  server-test:
    name: Server — Test
    runs-on: ubuntu-latest
    needs: server-audit

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blogplatform_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: Server

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test_user:test_password_ci@localhost:5432/blogplatform_test
      JWT_SECRET: ci_jwt_secret_min_32_chars_long_for_testing_only
      JWT_REFRESH_SECRET: ci_refresh_secret_min_32_chars_long_testing
      COOKIE_SECRET: ci_cookie_secret_min_64_chars_long_for_dummy_testing_purposes_abc
      FRONTEND_URL: http://localhost:3000
      PORT: 3001
      EMAIL_DISABLE: "true"
      LOG_LEVEL: error

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test --if-present

      - name: Startup smoke test
        run: |
          node src/server.js &
          SERVER_PID=$!
          sleep 5
          curl -f http://localhost:3001/health || (kill $SERVER_PID && exit 1)
          kill $SERVER_PID
          echo "Server started and health check passed"

  client-audit:
    name: Client — Audit & Build
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=moderate

      - name: Check for localStorage auth tokens
        run: |
          if grep -rn "localStorage" lib/ --include="*.ts" --include="*.tsx" 2>/dev/null | grep -qi "token\|auth\|jwt"; then
            echo "Auth token found in localStorage — use httpOnly cookies instead"
            exit 1
          fi
          echo "No auth tokens in localStorage"

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
        run: npm run build

      - name: Check standalone output
        run: |
          [ -d ".next/standalone" ] || (echo ".next/standalone missing — add output: 'standalone' to next.config.ts" && exit 1)
          echo "Standalone output present"

  docker-build:
    name: Docker — Build Verification
    runs-on: ubuntu-latest
    needs: [server-test, client-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Build server image
        run: docker build -t blogplatform-server:${{ github.sha }} ./Server

      - name: Build client image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://placeholder.example.com/api/v1 \
            -t blogplatform-client:${{ github.sha }} \
            ./client

      - name: Verify server image syntax
        run: |
          docker run --rm \
            -e NODE_ENV=production \
            -e PORT=3001 \
            -e DATABASE_URL="postgresql://fake:fake@localhost/fake" \
            -e JWT_SECRET="test_jwt_secret_at_least_32_characters_long" \
            -e JWT_REFRESH_SECRET="test_refresh_secret_32_characters_long" \
            -e COOKIE_SECRET="test_cookie_secret_64_characters_long_enough_for_testing" \
            -e FRONTEND_URL="http://localhost:3000" \
            -e EMAIL_DISABLE="true" \
            blogplatform-server:${{ github.sha }} \
            node -e "import('./src/config/env.js')" || true
          echo "Server image syntax check passed"
