name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Pre-deploy secret check
        run: |
          if find . -name ".env" -not -name ".env.example" -not -path "*/node_modules/*" | grep -q .; then
            echo ".env file found in repo — ABORT"
            exit 1
          fi
          echo "No .env files in repo"

      - name: Build and push Docker images
        run: |
          echo "TODO: Configure deployment target"
          echo "See deployment notes below"

      - name: Post-deploy health check
        run: |
          echo "Waiting for deployment to stabilise..."
          sleep 30
          echo "Replace with actual health check: curl -f https://yourdomain.com/health"
